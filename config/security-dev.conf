# Somente desenvolvimento local (montado pelo docker-compose-dev.yml, nunca em produção).
#
# O security.conf marca todo cookie como Secure. Em http://localhost o Safari descarta
# cookies Secure (Chrome e Firefox tratam localhost como seguro e os aceitam): sem o
# cookie de sessão, toda checagem de token CSRF falha. Este arquivo é carregado depois
# do security.conf (conf-enabled em ordem alfabética) e remove só o atributo Secure.
<IfModule mod_headers.c>
    Header edit* Set-Cookie "(?i);\s*Secure(?=;|$)" ""
</IfModule>
