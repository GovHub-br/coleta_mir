
; ---------------------------------------------------------------------
; 1. Bloqueio de Funções de Sistema Perigosas
; ---------------------------------------------------------------------
; Nota: Ajuste esta lista caso seu framework precise de alguma delas.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source

; ---------------------------------------------------------------------
; 2. Bloqueio de Execução de Código Remoto (RCE)
; ---------------------------------------------------------------------
allow_url_fopen = Off
allow_url_include = Off
