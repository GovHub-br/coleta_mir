# Hardening ( Apache + Joomla )

# 1. Oculta assinaturas do servidor
ServerTokens ProductOnly
ServerSignature Off
TraceEnable Off

# 2. Bloqueio de arquivos sensíveis
<FilesMatch "^(\.env|composer\.json|composer\.lock|phpunit\.xml|\.git)">
    Require all denied
</FilesMatch>

<FilesMatch "\.(bak|old|orig|save|swp)$">
    Require all denied
</FilesMatch>

# 3. Variáveis OIDC para o PHP (Apache não as expõe automaticamente em alguns setups)
<IfModule mod_env.c>
    PassEnv OIDC_PROVIDER_PROFILE
    PassEnv OIDC_CLIENT_ID
    PassEnv OIDC_CLIENT_SECRET
    PassEnv OIDC_PUBLIC_BASE_URL
    PassEnv OIDC_REDIRECT_URI_MODE
</IfModule>

# 4. Tratamento de cabeçalhos e CSP
<IfModule mod_headers.c>

    Header unset X-Powered-By
    Header always unset X-Powered-By

    Header unset Content-Security-Policy
    Header always unset Content-Security-Policy

    # CSP (CWE-693 / ZAP 10055)
    # - Removido 'unsafe-eval' (eval/new Function).
    # - Mantido 'wasm-unsafe-eval' para Power BI (escopo menor).
    # - 'unsafe-inline' em script-src: necessário (Joomla options/inline sem nonce).
    # - 'unsafe-inline' em style-src: necessário (Helix/Joomla: style="", <style>
    #   dinâmicos — page title bg, badges, container max-width, SP Page Builder).
    #   NÃO usar style-src-attr 'none' aqui: quebraria dezenas de style="..." legítimos.
    # Remoção total de unsafe-inline (script + style) exige CSP dinâmica com nonce/hash
    # via plugin System - HTTP Headers (não Apache Header estático).
    # Frontend: script-src-attr 'none' bloqueia onclick=/onerror= XSS clássico.
    # /administrator: sem essa diretiva — a toolbar do Joomla usa onclick
    # (ex.: Novo módulo → view=select). Herda script-src 'unsafe-inline'.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: data: https://app.powerbi.com https://*.powerbi.com https://*.msauth.net https://*.microsoftonline.com https://*.msecnd.net https://*.vlibras.gov.br https://vlibras.gov.br https://cdn.jsdelivr.net https://static.cloudflareinsights.com https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.powerbi.com https://fonts.cdnfonts.com https://*.vlibras.gov.br https://vlibras.gov.br https://cdn.jsdelivr.net https://challenges.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://*.powerbi.com https://fonts.cdnfonts.com https://*.vlibras.gov.br https://vlibras.gov.br https://fs.microsoft.com https://content.powerapps.com https://cdn.jsdelivr.net https://challenges.cloudflare.com; img-src 'self' data: https://*.powerbi.com https://*.msecnd.net https://*.vlibras.gov.br https://vlibras.gov.br https://cdn.jsdelivr.net https://challenges.cloudflare.com; frame-src 'self' https://app.powerbi.com https://*.powerbi.com https://*.microsoft.com https://itprocloud-my.sharepoint.com https://*.vlibras.gov.br https://vlibras.gov.br https://challenges.cloudflare.com; connect-src 'self' blob: data: https://*.powerbi.com https://*.microsoftonline.com https://*.local.powerbi.com https://*.vlibras.gov.br https://vlibras.gov.br https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://challenges.cloudflare.com; worker-src 'self' blob: data:; frame-ancestors 'self'; form-action 'self';"

    <If "%{REQUEST_URI} !~ m#^/administrator(/|$)#">
        Header always edit Content-Security-Policy "default-src 'self'; " "default-src 'self'; script-src-attr 'none'; "
    </If>

    # Mitiga Clickjacking
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "unload=()"

    # Mitiga MIME-Sniffing Attacks / Drive-by Downloads
    Header always set X-Content-Type-Options "nosniff"

    # Mitiga Privacy Leakage / Information Disclosure via Referer
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Mitiga XSS em navegadores legados
    Header always set X-XSS-Protection "1; mode=block"

    # Mitiga Session Hijacking (Roubo de Sessão) / Cookie Theft via XSS
    Header edit Set-Cookie ^(.*)$ "$1; HTTPOnly; Secure; SameSite=Lax"
</IfModule>

# 5. Controle de acesso ao /administrator por IP
<IfModule mod_rewrite.c>
    RewriteEngine On
    # Substitua pelo seu IP real ou range da VPN
    #RewriteCond %{REMOTE_ADDR} !^192\.168\.10\.50$
    #RewriteRule ^administrator($|/) - [R=404,L]
</IfModule>
