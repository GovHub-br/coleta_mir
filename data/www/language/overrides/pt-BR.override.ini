; Substituições de textos do Joomla em pt-BR (site).
;
; Este arquivo é versionado de propósito: os deploys de homologação e produção fazem
; rsync --delete do repositório, então qualquer arquivo do servidor que não esteja no git
; é apagado. Substituições criadas pelo admin (Sistema > Idiomas > Substituições) gravam
; neste arquivo no servidor e somem no deploy seguinte. Novas substituições devem ser
; adicionadas aqui, pelo repositório. Salvar pelo admin também reescreve o arquivo e
; remove estes comentários.

; O usuário do Ente é o CPF: rótulos do formulário de recuperação de senha e da página de login
COM_USERS_FIELD_RESET_CONFIRM_USERNAME_LABEL="CPF"
COM_USERS_LOGIN_USERNAME_LABEL="CPF"
