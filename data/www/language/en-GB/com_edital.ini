COM_EDITAL_FORM_DESC_PERGUNTA_DS_DESCRICAO="Help text shown below the field on the applicant form. For an informational question, this content is the notice message, using the style set in Options. HTML is allowed."
COM_EDITAL_FORM_DESC_PERGUNTA_DS_INFORMACAO_COMPLEMENTAR="Information box with an icon shown below the file upload, only for a file question. HTML is allowed. Other question types do not show it on the applicant page."
COM_EDITAL_FORM_DESC_PERGUNTA_DS_INFORMACAO_COMPLEMENTAR2="Help text shown right after the question title and before the answer on the applicant form. It applies to every question type. HTML is allowed."
COM_EDITAL_FORM_DESC_PERGUNTA_TP_ETAPA="Chooses the screen that loads this question. Registration: public application form. Adhesion help: the Need help block on that same form. Appeal: form the applicant sends in My adhesion when the adhesion was denied. Appeal review: questions used by the team while reviewing the appeal. Review, Complement and Signature can classify the question, but no applicant screen loads those stages."
COM_EDITAL_FORM_DESC_PERGUNTA_QT_DIAS_COMPLEMENTACAO="Days counted when the team asks for complementation of this question's answer. The system stores the deadline at the end of that period, at 23:59, and uses the latest date among answers under complementation as the adhesion deadline. If left empty, the period used is 5 days. The applicant receives an email about the request."
