COM_EDITAL_FORM_DESC_PERGUNTA_DEPENDE_DE="Select another question from the same call or Applicant. On the form, this question stays hidden until the answer matches a value in Display if equal to. For Applicant, the values are State, Municipality and Consortiums/Municipal Associations. Leave as None to show it for every applicant type. A hidden question is not required on submit. The preview shows the condition as text."
