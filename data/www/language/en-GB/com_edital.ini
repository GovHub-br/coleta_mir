COM_EDITAL_FORM_DESC_PERGUNTA_DEPENDE_DE_OCULTAR="Select another question from the same call or Applicant. If the source is visible and the answer matches a value in Hide if equal to, this question disappears from the form. For Applicant, the values are State, Municipality and Consortiums/Municipal Associations. Leave as None to skip this condition. When both rules exist, the question appears only if the display rule matches and the hide rule does not."
COM_EDITAL_FORM_LBL_PERGUNTA_DEPENDE_DE_OCULTAR_VALOR="Hide if equal to"
COM_EDITAL_FORM_DESC_PERGUNTA_DEPENDE_DE_OCULTAR_VALOR="One or more values that hide this question. If the source is a list, single choice or multiple choice, select its options. If it is Applicant, select State, Municipality or Consortiums/Municipal Associations. Otherwise, enter the text. One matching value is enough. With no value selected, this rule does not hide the question. The source must be visible for the hide rule to apply."
