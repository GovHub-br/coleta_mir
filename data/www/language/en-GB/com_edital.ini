COM_EDITAL_FORM_DESC_PERGUNTA_QT_DIAS_NAO_APLICA="Check this for forms that do not count a deadline per question, such as the Municipal Census and the State Census. The days field is disabled and no deadline is stored on this question. Those censuses use a 30-day deadline for the whole response."
