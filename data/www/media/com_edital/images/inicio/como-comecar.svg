<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" font-family="Inter, Raleway, 'Segoe UI', Arial, sans-serif">
<title>Como começar no Coleta MIR</title><desc>A pessoa cria a conta com CPF, nome, e-mail e senha. Gestor de TED informa a UG, convenente informa o CNPJ e servidor do MIR pede o perfil MIR; o MIR confere o pedido e libera ou recusa com motivo. Responsável por projeto não pede perfil e vai direto para Meus instrumentos.</desc>
<defs><marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="560" fill="#FFFFFF"/>
<text x="20" y="36" font-size="12" font-weight="700" fill="#202020" text-anchor="start" dominant-baseline="central">Legenda</text>
<circle cx="99" cy="36" r="8" fill="#6B7280"/>
<text x="114" y="36" font-size="12" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">Início e fim</text>
<rect x="215.2" y="27" width="26" height="18" rx="4" fill="#7A34F3"/>
<text x="249.2" y="36" font-size="12" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">Etapa (cor do ator)</text>
<polygon points="409.59999999999997,25 422.59999999999997,36 409.59999999999997,47 396.59999999999997,36" fill="#C520A4"/>
<text x="430.59999999999997" y="36" font-size="12" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">Decisão</text>
<rect x="498.79999999999995" y="27" width="34" height="18" rx="9" fill="#FFF" stroke="#6B7280"/>
<text x="540.8" y="36" font-size="12" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">Tela ou formulário</text>
<rect x="681.5999999999999" y="27" width="30" height="18" rx="4" fill="#F8F9FA" stroke="#9CA3AF" stroke-dasharray="4 3"/>
<text x="719.5999999999999" y="36" font-size="12" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">Observação</text>
<rect x="20" y="80" width="1160" height="240" rx="10" fill="#F0E8FE" opacity="0.55"/>
<rect x="20" y="80" width="160" height="240" rx="10" fill="#7A34F3"/>
<text x="100" y="191.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Quem vai</text>
<text x="100" y="209.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">preencher</text>
<circle cx="222" cy="210" r="14" fill="#7A34F3"/>
<text x="222" y="236" font-size="12" font-weight="600" fill="#202020" text-anchor="middle" dominant-baseline="central">Início</text>
<path d="M236 210 H286" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="290" y="182" width="200" height="56" rx="8" fill="#7A34F3"/>
<text x="390.0" y="201.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Criar a conta</text>
<text x="390.0" y="219.0" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">CPF, nome, e-mail, senha</text>
<rect x="305" y="246" width="170" height="22" rx="11" fill="#FFFFFF" stroke="#7A34F3" stroke-width="1"/>
<text x="390.0" y="257" font-size="12" font-weight="600" fill="#4E1FA0" text-anchor="middle" dominant-baseline="central">Solicitar acesso</text>
<path d="M490 210 H526" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<polygon points="600,168 670,210 600,252 530,210" fill="#C520A4"/>
<text x="600" y="202" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Qual o seu</text>
<text x="600" y="218" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">papel?</text>
<path d="M670 210 H695 V168 H716" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="720" y="150" width="240" height="36" rx="8" fill="#7A34F3"/>
<text x="840" y="168" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Gestor de TED: informa a UG</text>
<path d="M960 168 H985" fill="none" stroke="#4B5563" stroke-width="1.5"/>
<path d="M670 210 H716" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="720" y="192" width="240" height="36" rx="8" fill="#7A34F3"/>
<text x="840" y="210" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Convenente: informa o CNPJ</text>
<path d="M960 210 H985" fill="none" stroke="#4B5563" stroke-width="1.5"/>
<path d="M670 210 H695 V252 H716" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="720" y="234" width="240" height="36" rx="8" fill="#7A34F3"/>
<text x="840" y="252" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Servidor do MIR: pede perfil</text>
<path d="M960 252 H985" fill="none" stroke="#4B5563" stroke-width="1.5"/>
<path d="M985 168 V330 H810 V356" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<text x="620" y="116" font-size="12" font-weight="600" fill="#374151" text-anchor="start" dominant-baseline="central">Responsável por projeto: não pede perfil</text>
<path d="M600 168 V128 H1095 V178" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="1010" y="182" width="170" height="56" rx="8" fill="#7A34F3"/>
<text x="1095.0" y="201.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Preencher</text>
<text x="1095.0" y="219.0" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">em Meus instrumentos</text>
<path d="M1160 238 V262" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<circle cx="1160" cy="280" r="14" fill="#7A34F3"/>
<text x="1138" y="280" font-size="12" font-weight="600" fill="#202020" text-anchor="end" dominant-baseline="central">Fim</text>
<rect x="290" y="278" width="400" height="30" rx="6" fill="#F8F9FA" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="304" cy="293" r="8" fill="#9CA3AF"/>
<text x="304" y="293" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">i</text>
<text x="318" y="293" font-size="12" font-weight="400" fill="#202020" text-anchor="start" dominant-baseline="central">Quem já tem conta pede outros perfis em &quot;Meus acessos&quot;</text>
<rect x="20" y="330" width="1160" height="210" rx="10" fill="#EDE7F8" opacity="0.55"/>
<rect x="20" y="330" width="160" height="210" rx="10" fill="#5B21B6"/>
<text x="100" y="426.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Servidor</text>
<text x="100" y="444.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">do MIR</text>
<rect x="720" y="360" width="180" height="50" rx="8" fill="#5B21B6"/>
<text x="810.0" y="385.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Conferir o pedido</text>
<rect x="725" y="418" width="170" height="22" rx="11" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1"/>
<text x="810.0" y="429" font-size="12" font-weight="600" fill="#3B1578" text-anchor="middle" dominant-baseline="central">Solicitações de acesso</text>
<path d="M900 385 H996" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<polygon points="1060,347 1120,385 1060,423 1000,385" fill="#C520A4"/>
<text x="1060" y="385" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Libera?</text>
<path d="M1060 347 V242" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<text x="1068" y="300" font-size="12" font-weight="600" fill="#374151" text-anchor="start" dominant-baseline="central">Sim</text>
<path d="M1060 423 V448" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<text x="1068" y="436" font-size="12" font-weight="600" fill="#374151" text-anchor="start" dominant-baseline="central">Não</text>
<rect x="975" y="452" width="170" height="50" rx="8" fill="#5B21B6"/>
<text x="1060.0" y="477.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Recusar com motivo</text>
<rect x="290" y="452" width="380" height="46" rx="6" fill="#F8F9FA" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="304" cy="467" r="8" fill="#9CA3AF"/>
<text x="304" y="467" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">i</text>
<text x="318" y="467" font-size="12" font-weight="400" fill="#202020" text-anchor="start" dominant-baseline="central">Quem pediu acompanha a liberação ou o motivo da</text>
<text x="318" y="483" font-size="12" font-weight="400" fill="#202020" text-anchor="start" dominant-baseline="central">recusa em &quot;Meus acessos&quot;</text>
</svg>