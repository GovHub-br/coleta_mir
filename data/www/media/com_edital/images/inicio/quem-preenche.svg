<rect x="290" y="125" width="210" height="50" rx="8" fill="#5B21B6"/>
<text x="395.0" y="150.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Abrir &quot;Novo instrumento&quot;</text>
<path d="M500 150 H546" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="550" y="122" width="260" height="56" rx="8" fill="#5B21B6"/>
<text x="680.0" y="141.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Preencher identificação,</text>
<text x="680.0" y="159.0" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">responsáveis e fiscalização</text>
<rect x="600" y="186" width="160" height="22" rx="11" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1"/>
<text x="680.0" y="197" font-size="12" font-weight="600" fill="#3B1578" text-anchor="middle" dominant-baseline="central">Formulário do MIR</text>
<path d="M810 150 H852" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<circle cx="870" cy="150" r="14" fill="#5B21B6"/>
