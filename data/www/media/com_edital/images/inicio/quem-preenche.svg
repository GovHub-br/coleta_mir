<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" font-family="Inter, Raleway, 'Segoe UI', Arial, sans-serif">
<title>Quem preenche o quê no Coleta MIR</title><desc>Servidor do MIR cadastra o instrumento. Gestor de TED ou convenente abre o instrumento pela UG ou CNPJ, informa execução e contrapartida e lista os projetos com o CPF do responsável, ou registra as atividades quando a própria unidade executa. O responsável pelo projeto entra com o CPF, abre o projeto e registra cada atividade e os beneficiários.</desc>
<defs><marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="640" fill="#FFFFFF"/>
<text x="20" y="36" font-size="12" font-weight="700" fill="#202020" text-anchor="start" dominant-baseline="central">Legenda</text>
<circle cx="99" cy="36" r="8" fill="#6B7280"/>
<text x="114" y="36" font-size="12" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">Início e fim</text>
<rect x="215.2" y="27" width="26" height="18" rx="4" fill="#5B21B6"/>
<text x="249.2" y="36" font-size="12" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">Etapa (cor do ator)</text>
<polygon points="409.59999999999997,25 422.59999999999997,36 409.59999999999997,47 396.59999999999997,36" fill="#C520A4"/>
<text x="430.59999999999997" y="36" font-size="12" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">Decisão</text>
<rect x="498.79999999999995" y="27" width="34" height="18" rx="9" fill="#FFF" stroke="#6B7280"/>
<text x="540.8" y="36" font-size="12" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">Tela ou formulário</text>
<rect x="681.5999999999999" y="27" width="30" height="18" rx="4" fill="#F8F9FA" stroke="#9CA3AF" stroke-dasharray="4 3"/>
<text x="719.5999999999999" y="36" font-size="12" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">Observação</text>
<rect x="807.5999999999999" y="27" width="30" height="18" rx="4" fill="#F8F9FA" stroke="#C520A4" stroke-dasharray="0"/>
<text x="845.5999999999999" y="36" font-size="12" font-weight="400" fill="#374151" text-anchor="start" dominant-baseline="central">Dado pessoal (LGPD)</text>
<rect x="20" y="80" width="1160" height="170" rx="10" fill="#EDE7F8" opacity="0.55"/>
<rect x="20" y="80" width="160" height="170" rx="10" fill="#5B21B6"/>
<text x="100" y="156.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Servidor</text>
<text x="100" y="174.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">do MIR</text>
<circle cx="222" cy="150" r="14" fill="#5B21B6"/>
<text x="222" y="176" font-size="12" font-weight="600" fill="#202020" text-anchor="middle" dominant-baseline="central">Início</text>
