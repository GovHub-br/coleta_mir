<text x="318" y="217" font-size="12" font-weight="400" fill="#202020" text-anchor="start" dominant-baseline="central">vêm da base do MIR</text>
<rect x="20" y="260" width="1160" height="190" rx="10" fill="#F3E6F8" opacity="0.55"/>
<rect x="20" y="260" width="160" height="190" rx="10" fill="#9520B6"/>
<text x="100" y="346.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Gestor de TED</text>
<text x="100" y="364.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ou convenente</text>
<circle cx="222" cy="315" r="14" fill="#9520B6"/>
<text x="222" y="341" font-size="12" font-weight="600" fill="#202020" text-anchor="middle" dominant-baseline="central">Início</text>
<path d="M236 315 H286" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="290" y="290" width="180" height="50" rx="8" fill="#9520B6"/>
<text x="380.0" y="315.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Abrir o instrumento</text>
<rect x="285" y="348" width="190" height="22" rx="11" fill="#FFFFFF" stroke="#9520B6" stroke-width="1"/>
<text x="380.0" y="359" font-size="12" font-weight="600" fill="#5E1473" text-anchor="middle" dominant-baseline="central">UG (TED) · CNPJ (convênio)</text>
<path d="M470 315 H506" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="510" y="287" width="200" height="56" rx="8" fill="#9520B6"/>
<text x="610.0" y="306.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Informar execução</text>
