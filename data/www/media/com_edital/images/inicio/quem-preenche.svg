<rect x="525" y="351" width="170" height="22" rx="11" fill="#FFFFFF" stroke="#9520B6" stroke-width="1"/>
<text x="610.0" y="362" font-size="12" font-weight="600" fill="#5E1473" text-anchor="middle" dominant-baseline="central">Formulário do gestor</text>
<path d="M710 315 H726" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<polygon points="790,275 850,315 790,355 730,315" fill="#C520A4"/>
<text x="790" y="307" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Executa por</text>
<text x="790" y="323" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">parceiro?</text>
<text x="890" y="300" font-size="12" font-weight="600" fill="#374151" text-anchor="middle" dominant-baseline="central">Sim ou ambos</text>
<path d="M850 315 H926" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="930" y="287" width="190" height="56" rx="8" fill="#9520B6"/>
<text x="1025.0" y="306.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Listar os projetos</text>
<text x="1025.0" y="324.0" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">com CPF do responsável</text>
<path d="M1120 315 H1138" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<circle cx="1156" cy="315" r="14" fill="#9520B6"/>
<text x="1156" y="341" font-size="12" font-weight="600" fill="#202020" text-anchor="middle" dominant-baseline="central">Fim</text>
<path d="M790 355 V378" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<text x="798" y="366" font-size="12" font-weight="600" fill="#374151" text-anchor="start" dominant-baseline="central">Não ou ambos</text>
<rect x="690" y="382" width="200" height="56" rx="8" fill="#9520B6"/>
<text x="790.0" y="401.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Registrar as atividades</text>
<text x="790.0" y="419.0" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">da própria unidade</text>
<path d="M1025 343 V470 H630 V502" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<text x="830" y="460" font-size="12" font-weight="600" fill="#374151" text-anchor="middle" dominant-baseline="central">o projeto aparece para o responsável pelo CPF</text>
<rect x="20" y="460" width="1160" height="160" rx="10" fill="#FEEEE2" opacity="0.55"/>
<rect x="20" y="460" width="160" height="160" rx="10" fill="#F97316"/>
<text x="100" y="531.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Responsável</text>
<text x="100" y="549.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">pelo projeto</text>
