<path d="M470 530 H536" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="540" y="505" width="180" height="50" rx="8" fill="#F97316"/>
<text x="630.0" y="530.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Abrir o projeto</text>
<rect x="550" y="563" width="160" height="22" rx="11" fill="#FFFFFF" stroke="#F97316" stroke-width="1"/>
<text x="630.0" y="574" font-size="12" font-weight="600" fill="#9A4A0E" text-anchor="middle" dominant-baseline="central">Meus instrumentos</text>
<path d="M720 530 H766" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="770" y="502" width="230" height="56" rx="8" fill="#F97316"/>
<text x="885.0" y="521.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Registrar a atividade</text>
<text x="885.0" y="539.0" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">e os beneficiários</text>
<rect x="800" y="566" width="170" height="22" rx="11" fill="#FFFFFF" stroke="#F97316" stroke-width="1"/>
<text x="885.0" y="577" font-size="12" font-weight="600" fill="#9A4A0E" text-anchor="middle" dominant-baseline="central">Formulário de execução</text>
<path d="M1000 530 H1038" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#seta)"/>
<circle cx="1056" cy="530" r="14" fill="#F97316"/>
<text x="1056" y="556" font-size="12" font-weight="600" fill="#202020" text-anchor="middle" dominant-baseline="central">Fim</text>
<rect x="1010" y="566" width="170" height="46" rx="6" fill="#F8F9FA" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="1024" cy="581" r="8" fill="#9CA3AF"/>
<text x="1024" y="581" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">i</text>
<text x="1038" y="581" font-size="12" font-weight="400" fill="#202020" text-anchor="start" dominant-baseline="central">Um preenchimento</text>
<text x="1038" y="597" font-size="12" font-weight="400" fill="#202020" text-anchor="start" dominant-baseline="central">por atividade</text>
<rect x="290" y="566" width="240" height="46" rx="6" fill="#F8F9FA" stroke="#C520A4" stroke-width="1" stroke-dasharray="0"/>
<circle cx="304" cy="581" r="8" fill="#C520A4"/>
<text x="304" y="581" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">!</text>
<text x="318" y="581" font-size="12" font-weight="400" fill="#202020" text-anchor="start" dominant-baseline="central">O CPF é dado pessoal: serve só</text>
<text x="318" y="597" font-size="12" font-weight="400" fill="#202020" text-anchor="start" dominant-baseline="central">para liberar o projeto</text>
</svg>