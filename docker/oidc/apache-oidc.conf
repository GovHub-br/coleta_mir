ServerName sinapir-homol.igualdaderacial.gov.br

<VirtualHost *:80>
    ServerName sinapir-homol.igualdaderacial.gov.br
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteRule ^ https://sinapir-homol.igualdaderacial.gov.br%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" oidc_no_query
    CustomLog ${APACHE_LOG_DIR}/access.log oidc_no_query
</VirtualHost>

<VirtualHost *:443>
    ServerName sinapir-homol.igualdaderacial.gov.br
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/tls.crt
    SSLCertificateKeyFile /etc/apache2/ssl/tls.key

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" oidc_no_query
    CustomLog ${APACHE_LOG_DIR}/access.log oidc_no_query

    RewriteEngine On

    RewriteCond %{REQUEST_METHOD} GET
    RewriteCond %{QUERY_STRING} (^|&)state=[A-Za-z0-9_-]{43,128}(&|$)
    RewriteCond %{QUERY_STRING} (^|&)code=[^&]+(&|$)
    RewriteCond %{QUERY_STRING} !(^|&)error=
    RewriteRule ^/?$ /index.php?option=com_oidcclient&task=callback.complete [END,QSA]

    RewriteCond %{REQUEST_METHOD} GET
    RewriteCond %{QUERY_STRING} (^|&)state=[A-Za-z0-9_-]{43,128}(&|$)
    RewriteCond %{QUERY_STRING} (^|&)error=[^&]+(&|$)
    RewriteCond %{QUERY_STRING} !(^|&)code=
    RewriteRule ^/?$ /index.php?option=com_oidcclient&task=callback.complete [END,QSA]
</VirtualHost>
